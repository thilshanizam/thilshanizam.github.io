
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Political Life | Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>POLITICAL LIFE</h1>
        <h2>Republic of Valoria</h2>

        <p id="playerStatus">Checking player account...</p>

        <!-- Character creation -->
        <section id="gameContent" hidden>
            <h2>Create Your Character</h2>

            <label for="characterName">Character Name</label>
            <input
                type="text"
                id="characterName"
                maxlength="40"
                placeholder="Enter character name"
            >

            <p>Starting Age: 22 years</p>
            <p>Career: Ordinary Citizen</p>

            <button id="createCharacterBtn">
                Create Character
            </button>

            <p id="characterMessage"></p>
        </section>

        <!-- Daily gameplay -->
        <section id="dailyGame" hidden>
            <h2 id="playerName"></h2>

            <p>
                Day: <strong id="dayValue"></strong>
                |
                Career: <strong id="careerValue"></strong>
            </p>

            <p>
                Money: <strong id="moneyValue"></strong>
                |
                Reputation: <strong id="reputationValue"></strong>
                |
                Influence: <strong id="influenceValue"></strong>
            </p>

            <hr>

            <h2 id="eventTitle"></h2>
            <p id="eventDescription"></p>

            <div id="choicesContainer"></div>

            <p id="decisionOutcome"></p>
        </section>

        <p>
            <a href="index.html">Back to Home</a>
        </p>
    </main>

    <script type="module" src="js/game.js"></script>
</body>
</html>
